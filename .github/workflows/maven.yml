name: Java CI with Maven

on:
  push:
    branches:
      - Release*
      - develop
    paths-ignore:
      - 'docs/**'

  pull_request:
    branches:
      - Release*
      - develop
    paths-ignore:
      - 'docs/**'

  workflow_dispatch:

  # Schedule runs on the default branch.
  schedule:
    - cron: '0 6 * * 1-5'

# Ensure only one build changes dev environment at the same time    
concurrency: dev
# GITHUB_REF=refs/heads/testmain
#

jobs:
  build:

    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.output_image_tag.outputs.image_tag }}
      version_only_tag: ${{ steps.output_version_only_tag.outputs.version_only_tag }}
      deployment_ids: ${{ steps.ecs-deploy.outputs.deployment_ids }}

    steps:

    - name: Checkout the software
      uses: actions/checkout@v7
      # Necessary to enable push to protected branch
      with:
        ssh-key: ${{secrets.ACTIONS_KEY}}

    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Set up Maven
      uses: stCarolas/setup-maven@v5.1
      with:
        maven-version: 3.9.0

    - name: Set up Toolchain
      shell: bash
      run: |
          echo COMPUTERNAME=`hostname` >> $GITHUB_ENV
          # Set up for unit testing against JPA repository
          echo SPRING_DATABASE=jpa >> $GITHUB_ENV
          mkdir -p ~/.m2 \
          && cat << EOF > ~/.m2/toolchains.xml
          <?xml version="1.0" encoding="UTF8"?>
          <toolchains>
            <toolchain>
              <type>jdk</type>
                <provides>
                  <version>21</version>
                  <vendor>sun</vendor>
                </provides>
                <configuration>
                  <jdkHome>$JAVA_HOME_21_X64</jdkHome>
                </configuration>
            </toolchain>
            <toolchain>
              <type>jdk</type>
                <provides>
                  <version>17</version>
                  <vendor>sun</vendor>
                </provides>
                <configuration>
                  <jdkHome>$JAVA_HOME_17_X64</jdkHome>
                </configuration>
            </toolchain>
          </toolchains>
          EOF

          cat << EOF > ~/.m2/settings.xml
          <?xml version="1.0" encoding="UTF8"?>
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
            xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
            xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0
            https://maven.apache.org/xsd/settings-1.0.0.xsd">
            <localRepository>~/.m2/repository</localRepository>
            <interactiveMode />
            <usePluginRegistry />
            <offline />
            <servers>
              <server>
                <id>github</id>
                <username>${{ github.actor }}</username>
                <password>${{ secrets.GITHUB_TOKEN }}</password>
              </server>
              <server>
                <id>github-bom</id>
                <username>${{ github.actor }}</username>
                <password>${{ secrets.GITHUB_TOKEN }}</password>
              </server>
              <server>
                <id>github-core</id>
                <username>${{ github.actor }}</username>
                <password>${{ secrets.GITHUB_TOKEN }}</password>
              </server>
              <server>
                <id>github-hub</id>
                <username>${{ github.actor }}</username>
                <password>${{ secrets.GITHUB_TOKEN }}</password>
              </server>
            </servers>
            <mirrors />
            <proxies />
            <profiles />
            <activeProfiles />
          </settings>
          EOF
          BASE_TAG=`mvn help:evaluate -Dexpression=project.version -q -DforceStdout`
          echo BASE_TAG=$BASE_TAG >> $GITHUB_ENV
          echo VERSION_ONLY_TAG=`echo -n $BASE_TAG | sed "s/-.*$//g"` >> $GITHUB_ENV

    - name: Sets env vars for push or pull request to release branch (default behavior)
      run: |
        echo IMAGE_TAG=`echo -n ${{env.VERSION_ONLY_TAG}}-SNAPSHOT-${{github.run_number}}` >> $GITHUB_ENV
        echo IMAGE_BRANCH_TAG=${{env.VERSION_ONLY_TAG}}-SNAPSHOT >> $GITHUB_ENV

    # If pulling to release branch (cutting a release), set branch tag appropriately
    - name: Sets env vars for pull to release branch
      if: ${{ startsWith(github.base_ref, 'Release')}}
      run: |
        echo IMAGE_TAG=`echo -n ${{env.VERSION_ONLY_TAG}}-SNAPSHOT-${{github.run_number}}` >> $GITHUB_ENV
        echo IMAGE_BRANCH_TAG=${{env.VERSION_ONLY_TAG}}-SNAPSHOT >> $GITHUB_ENV
        mvn versions:set -DnewVersion=${{env.VERSION_ONLY_TAG}}-IZGW-SNAPSHOT -f pom.xml

    # If pushing to release branch (cutting a release), set branch tag appropriately
    - name: Sets env vars for pull to release branch
      if: ${{ startsWith(github.ref_name, 'Release')}}
      run: |
        echo IMAGE_TAG=`echo -n ${{env.VERSION_ONLY_TAG}}-RELEASE-${{github.run_number}}` >> $GITHUB_ENV
        echo IMAGE_BRANCH_TAG=${{env.VERSION_ONLY_TAG}}-RELEASE >> $GITHUB_ENV
        mvn versions:set -DnewVersion=${{env.VERSION_ONLY_TAG}}-IZGW-RELEASE -f pom.xml
        if [ ${{ github.event_name }} == 'push' ]
        then
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A
          # Only push if something was committed
          if git commit -m "Update version to $IMAGE_BRANCH_TAG"
          then
            git pull
            git push
          fi
        fi

    - name: List m2
      shell: bash
      run: |
        # Display data for DX
        echo BASE_REF: ${{ github.base_ref }}
        echo HEAD_REF: ${{ github.head_ref }}
        echo REF_NAME: ${{ github.ref_name }}
        echo REF: ${{ github.ref }}
        echo EVENT_NAME ${{ github.event_name }}
        echo TAG: $BASE_TAG
        echo DO_REVISION_CHECK: $DO_REVISION_CHECK
        echo IMAGE_TAG: $IMAGE_TAG
        echo IMAGE_BRANCH_TAG: $IMAGE_BRANCH_TAG
        echo VERSION_ONLY_TAG: $VERSION_ONLY_TAG
        cd ~/.m2
        ls -l

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v6
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{vars.AWS_REGION}}
        
    - name: Maven Install
      env:
        COMMON_PASS: ${{ secrets.COMMON_PASS }}
        ELASTIC_API_KEY: ${{ secrets.ELASTIC_API_KEY }}
        AMAZON_DYNAMODB_TABLE: izgateway-dev-test
        JWT_ISSUER: https://dev.console.izgateway.org
      run: |
        env && mvn -B -U clean package install site -Dbuildno=${{github.run_number}} \
            -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn \
            -DskipDependencyCheck=true \
            -Dimage.tag=${{env.IMAGE_TAG}}
            
# Use GitHub Action to speed up and improve dependency checking
# You can Disable automatic dependency checking in the build, this replaces it          
    - name: Get current date for cache key
      id: date
      run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

    - name: Cache Dependency-Check NVD data
      uses: actions/cache@v6
      with:
        path: ~/dependency-check-data
        key: dependency-check-nvd-${{ runner.os }}-${{ steps.date.outputs.date }}
        restore-keys: |
          dependency-check-nvd-${{ runner.os }}-

    - name: Dependency Check
      env:
        # Per https://github.com/marketplace/actions/dependency-check, fix JAVA_HOME location for action
        JAVA_HOME: /opt/jdk
      uses: dependency-check/Dependency-Check_Action@main
      continue-on-error: true
      timeout-minutes: 15
      with:
        project: IZ Gateway Hub
        path: target/${{env.IMAGE_TAG}}.jar
        format: 'HTML'
        out: 'target/site'
        args: >
          --data ~/dependency-check-data
          --ossIndexUsername ${{ secrets.OSS_INDEX_USERNAME }}
          --ossIndexPassword ${{ secrets.OSS_INDEX_PASSWORD }}       
          --failOnCVSS 7
          --format JSON
          --suppression ./dependency-suppression.xml
          --nvdApiKey ${{ secrets.NVDAPIKEY }}
          --disableNuspec    
          --disableNugetconf  
          --disableAssembly            
          --disableCentral

    - name: Upload dependency check log
      uses: actions/upload-artifact@v7
      if: ${{ always() }}
      with:
        name: DependencyCheck
        path: ./target/site/dependency-check-report.*

    - name: Publish Site (Develop)
      # Publish to /develop/ for: push to develop, PRs targeting develop, scheduled runs, manual dispatch
      if: |
        github.ref == 'refs/heads/develop' ||
        (github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'develop')
      uses: peaceiris/actions-gh-pages@v4.1.0
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./target/site
        destination_dir: develop

    - name: Publish Site (Current)
      # Publish to /current/ only on Release branch push
      if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/Release')
      uses: peaceiris/actions-gh-pages@v4.1.0
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./target/site
        destination_dir: current

    - name: Publish Site (Versioned)
      # Publish to /v{version}/ only on Release branch push (same time as APHL push)
      if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/Release')
      uses: peaceiris/actions-gh-pages@v4.1.0
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./target/site
        destination_dir: v${{ env.BASE_TAG }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2
      
    - name: Login to GitHub Repository
      uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5
          
    - name: Build and push Docker Image
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        ECR_REPOSITORY: izgateway-dev-phiz-web-ws
      id: build-image
      run: |
        docker buildx build --build-arg JAR_FILENAME=${{env.IMAGE_TAG}}.jar --build-arg IZGW_VERSION=${{env.IMAGE_TAG}} \
            --progress=plain --load \
            --cache-from=type=gha,scope=izgwhub \
            --cache-to=type=gha,scope=izgwhub,mode=max \
            -t iz-gateway:${{env.IMAGE_TAG}} \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:${{env.IMAGE_TAG}} \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:${{env.IMAGE_BRANCH_TAG}} \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
            -t ghcr.io/izgateway/izgw-hub:${{env.IMAGE_TAG}} \
            -t ghcr.io/izgateway/izgw-hub:${{env.IMAGE_BRANCH_TAG}} \
            -t ghcr.io/izgateway/izgw-hub:latest .
        docker image push --all-tags ghcr.io/izgateway/izgw-hub
        docker image push --all-tags $ECR_REGISTRY/$ECR_REPOSITORY

    # AWS_REGIONS can be set in GitHub Settings -> Secrets and variables -> Actions -> Variables -> Repository Variables
    # Format: space-separated regions (e.g., "us-east-1 us-west-2")
    # Default of us-east-1 will be used if this is not set
    # ECS_DESIRED_COUNT can be set in GitHub Settings -> Secrets and variables -> Actions -> Variables -> Repository Variables
    # This is used to know how many container instances to start. Default is 1 if not set
    - name: Update ECS service to force new deployment of latest image
      id: ecs-deploy
      uses: ./.github/actions/ecs-deploy
      with:
        cluster: izgateway-dev-izgateway-services
        service: izgateway-devalb-service
        regions: ${{ vars.AWS_REGIONS }}
        desired_count: ${{ vars.ECS_DESIRED_COUNT }}

    - name: Upload build environment as artifact for failed build
      uses: actions/upload-artifact@v7
      if: ${{ failure() }}
      with:
        name: build-failure
        path: .

    - name: Upload dependency check log
      uses: actions/upload-artifact@v7
      if: ${{ always() }}
      with:
        name: DependencyCheck
        path: ./target/dependency-check-report.*

    - name: Output the image tag
      id: output_image_tag
      run: echo "image_tag=${{env.IMAGE_TAG}}" >> "$GITHUB_OUTPUT"

    - name: Output the version only image tag
      id: output_version_only_tag
      run: echo "version_only_tag=${{env.VERSION_ONLY_TAG}}" >> "$GITHUB_OUTPUT"

  verify:
    needs: build
    runs-on: ubuntu-latest
    steps:

    - uses: actions/checkout@v7

    - name: Enable TCP keepalive for long-running requests
      run: |
        sudo sysctl -w net.ipv4.tcp_keepalive_time=15
        sudo sysctl -w net.ipv4.tcp_keepalive_intvl=10
        sudo sysctl -w net.ipv4.tcp_keepalive_probes=6

    - name: Configure npm global prefix
      run: |
        npm config set prefix '~/.npm-global'
        echo "$HOME/.npm-global/bin" >> $GITHUB_PATH

    - name: Cache npm globals
      uses: actions/cache@v6
      with:
        path: ~/.npm-global
        key: npm-globals-${{ hashFiles('.github/workflows/maven.yml') }}
        restore-keys: npm-globals-

    - name: Set up Tools
      shell: bash
      run: |
          npm install -g newman newman-reporter-junitfull xunit-viewer
          newman -v

    - name: Setup certs
      env:
        TESTING_CERT: ${{ secrets.TESTING_CERT }}
        TESTING_KEY: ${{ secrets.TESTING_KEY }}
        TESTING_PASS: ${{ secrets.TESTING_PASS }}
      run: |
        echo "$TESTING_CERT" > testing/newman.pem
        # Don't upload this file !!!
        echo "$TESTING_KEY" > testing/newman.key

        # Scope the mTLS client cert to only the real target host (host/port
        # read from the Postman environment file so this stays in sync with
        # it). Requests to `no_cert_host` (e.g. TC_API_KEY_EXP, which tests an
        # expired JWT) then get no client certificate at all, so the Hub's
        # cert-based auth fallback can't mask an expired-token rejection with
        # a successful cert-based login.
        # Don't upload this file !!! (embeds TESTING_PASS in plaintext)
        HOST=$(jq -r '.values[] | select(.key=="host") | .value' testing/scripts/dev.postman_environment.json)
        PORT=$(jq -r '.values[] | select(.key=="port") | .value' testing/scripts/dev.postman_environment.json)
        jq -n \
          --arg host "$HOST" \
          --arg port "$PORT" \
          --arg pass "$TESTING_PASS" \
          '[{
             name: "IZGW dev mTLS cert",
             matches: ["https://\($host)/*", "https://\($host):\($port)/*"],
             key: {src: "../newman.key"},
             cert: {src: "../newman.pem"},
             passphrase: $pass
           }]' > testing/newman-cert-list.json

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v6
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{vars.AWS_REGION}}

    - name: Add runner IP to security group
      run: |
        RUNNER_IP=$(curl -sf https://checkip.amazonaws.com || true)
        if [ -z "$RUNNER_IP" ]; then
          echo "Failed to determine runner public IP" >&2
          exit 1
        fi
        echo "RUNNER_IP=$RUNNER_IP" >> $GITHUB_ENV
        aws ec2 authorize-security-group-ingress \
          --group-id ${{ vars.AWS_SECURITY_GROUP_ID }} \
          --protocol tcp \
          --port 443 \
          --cidr ${RUNNER_IP}/32 || true
    # Having the wait for reload at this point allows some of the wasted waiting time to occur during build cleanup phase
    # and setup phase of this job.
    - name: Wait for reload of task to complete
      uses: ./.github/actions/ecs-wait-healthy
      with:
        cluster: izgateway-dev-izgateway-services
        service: izgateway-devalb-service
        regions: ${{ vars.AWS_REGIONS }}
        deployment_ids: ${{ needs.build.outputs.deployment_ids }}
          
    # Verify Filebeats is operating properly
    # Get the first service instance and check CloudWatch logs for indication that it connected
    - name: Verify ElasticSearch Logging Client Is running
      run: |
        SERVICE_INSTANCE=`aws ecs list-tasks --cluster izgateway-dev-izgateway-services --service-name izgateway-devalb-service  | jq '.taskArns[0]|split("/")[2]' -r`
        aws logs filter-log-events --log-group-name /ecs/izgateway-devalb-phiz-web-ws --log-stream-names ecs/izgateway-devalb-phiz-web-ws/$SERVICE_INSTANCE --filter-pattern "Connection to backoff" | grep established

    # Perform a little bit of warmup on the IZGW service using cert tests
    # TLS Testing can be Disabled per Security Team 5/23/2025, as it will be addressed via endpoint monitoring
#    - name: Execute Encryption/Cert Test
#      id: TlsTests
#      working-directory: ./testing
#      env:
#        IZGW_SSL_CLIENT_PASSPHRASE: ${{ secrets.TESTING_PASS }}
#      run: |
#        chmod +x ./tlstest.sh
#        mkdir ./logs
#        ./tlstest.sh | tee ./logs/tls-test.txt
#        [ `grep -c -e FAIL ./logs/tls-test.txt` -eq 0 ]

    # Include warmup in Verify b/c we must warm up server on which verification
    # is performed.  B/c Each stage runs in a separate virtual server, and our cluster
    # ensures requests are sticky based on IP Address, this ensures that requests for warmup and verification
    # go to the same server.
    - name: Run Warm Up for Functional Testing
      working-directory: ./testing/testdata
      env:
        NODE_OPTIONS: "--require ${{ github.workspace }}/.github/scripts/enable-keepalive.js"
      run: |
        mkdir ../logs
        startTime=$(date +%s);
        # Just Running the Smoke Test ONCE should be enough to warm up
        newman run ../scripts/IZGW_2.0_Integration_Test.postman_collection.json -n 1 --folder "Smoke Test" \
          "--environment" ../scripts/dev.postman_environment.json \
          "--ssl-extra-ca-certs" ../certs/izgwroot.pem \
          "--ssl-client-cert-list" ../newman-cert-list.json \
          "--insecure" -x > ../logs/warmup.log
        endTime=$(date +%s);
        WARMUP=$(($endTime-$startTime));
        echo Warmed up for $WARMUP seconds

    - name: Execute Functional Tests
      id: FunctionalTests
      working-directory: ./testing/testdata
      env:
        BEARER_TOKEN_EXPIRED: ${{ secrets.BEARER_TOKEN_EXPIRED }}
        BEARER_TOKEN_FOR_CICD: ${{ secrets.BEARER_TOKEN_FOR_CICD }}
        NODE_OPTIONS: "--require ${{ github.workspace }}/.github/scripts/enable-keepalive.js"
      run: |
        newman run ../scripts/IZGW_2.0_Integration_Test.postman_collection.json -n 1 --folder "Working" \
          "--env-var" "build=`grep Build target\classes\build.txt | cut '-d:' -f2 | cut -c2-99`" \
          "--env-var" "timestamp=`grep Timestamp target\classes\build.txt | cut '-d:' -f2 | cut -c2-99`" \
          "--environment" ../scripts/dev.postman_environment.json \
          "--env-var" "bearer_token_expired=$BEARER_TOKEN_EXPIRED" \
          "--env-var" "bearer_token_for_cicd=$BEARER_TOKEN_FOR_CICD" \
          "--ssl-extra-ca-certs" certs/izgwroot.pem \
          "--ssl-client-cert-list" ../newman-cert-list.json \
          "--insecure" --reporters cli,junitfull --reporter-junitfull-export ../logs/integration-test.xml

        xunit-viewer -r ../logs/integration-test.xml
        cp index.html ../logs/integration-test.html

    - name: Login to Amazon ECR
      id: login-ecr2
      uses: aws-actions/amazon-ecr-login@v2

    - name: Tag verified image
      env:
        ECR_REGISTRY: 357442695278.dkr.ecr.${{vars.AWS_REGION}}.amazonaws.com
        ECR_REPOSITORY: izgateway-dev-phiz-web-ws
      run: |
        docker pull $ECR_REGISTRY/$ECR_REPOSITORY:latest
        docker tag $ECR_REGISTRY/$ECR_REPOSITORY:latest $ECR_REGISTRY/$ECR_REPOSITORY:good
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:good

    - name: Upload test logs
      uses: actions/upload-artifact@v7
      if: ${{ always() }}
      with:
        name: TestLogs
        path: ./testing/logs

    - name: Upload build environment as artifact for failed build
      uses: actions/upload-artifact@v7
      if: ${{ failure() }}
      with:
        name: verify-failure
        path: |
            .
            !testing/newman.key
            !testing/newman-cert-list.json

    - name: Remove runner IP from security group
      if: always()
      run: |
        if [ -z "$RUNNER_IP" ]; then
          echo "RUNNER_IP not set; skipping security-group revoke"
          exit 0
        fi
        aws ec2 revoke-security-group-ingress \
          --group-id ${{ vars.AWS_SECURITY_GROUP_ID }} \
          --protocol tcp \
          --port 443 \
          --cidr ${RUNNER_IP}/32 || true

  push-to-aphl:
    # Remember to put verify back
    needs: [build, verify]
    runs-on: ubuntu-latest
    # This step should only be done on PUSH to a Release branch
    if: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/Release')) }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{vars.AWS_REGION}}

      - name: Login to Amazon ECR
        id: login-ecr2
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag verified image
        env:
          ECR_REGISTRY: 357442695278.dkr.ecr.${{vars.AWS_REGION}}.amazonaws.com
          ECR_REPOSITORY: izgateway-dev-phiz-web-ws
          IMAGE_TAG: ${{needs.build.outputs.image_tag}}
        run: |
          docker pull $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:latest iz-gateway:$IMAGE_TAG

      - name: Configure AWS credentials for APHL
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.APHL_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.APHL_AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{vars.AWS_REGION}}

      - name: Login to APHL Amazon ECR
        id: login-aphl-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag and push image to APHL Amazon ECR
        env:
          ECR_REGISTRY: ${{ secrets.APHL_ECR_REGISTRY }}
          ECR_REPOSITORY: ${{ secrets.APHL_ECR_REPOSITORY }}
          IMAGE_TAG: ${{needs.build.outputs.image_tag}}
          VERSION_ONLY_TAG: ${{needs.build.outputs.version_only_tag}}
        run: |
          echo "About to push image to APHL ECR: izgw-hub-${{env.VERSION_ONLY_TAG}}"
          docker image tag iz-gateway:${IMAGE_TAG} $ECR_REGISTRY/$ECR_REPOSITORY:izgw-hub-${{env.VERSION_ONLY_TAG}}
          docker image push --all-tags $ECR_REGISTRY/$ECR_REPOSITORY
