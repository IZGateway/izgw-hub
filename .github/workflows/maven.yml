name: Java CI with Maven

on:
  push:
    branches:
      - develop
    paths-ignore:
      - 'docs/**'

  pull_request:
    branches:
      - develop
    paths-ignore:
      - 'docs/**'

  workflow_dispatch:

  # Schedule runs on the default branch.
  schedule:
    - cron: '0 6 * * 1-5'

# Ensure only one build changes dev environment at the same time    
concurrency: dev
# GITHUB_REF=refs/heads/testmain
#

jobs:
  build:

    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.output_image_tag.outputs.image_tag }}
      version_only_tag: ${{ steps.output_version_only_tag.outputs.version_only_tag }}
      deployment_ids: ${{ steps.ecs-deploy.outputs.deployment_ids }}
      candidate_digest: ${{ steps.build-image.outputs.candidate_digest }}
      build_number: ${{ steps.build-meta.outputs.build_number }}
      build_timestamp: ${{ steps.build-meta.outputs.build_timestamp }}

    steps:

    - name: Checkout the software
      uses: actions/checkout@v7
      # No ssh-key: development CI no longer commits a release version, so it
      # does not need the protected-branch push identity. Releases use the
      # release GitHub App in release.yml and hotfix.yml.

    - name: Set up JDK 21
      uses: actions/setup-java@v6
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Set up Maven
      uses: stCarolas/setup-maven@v5.1
      with:
        maven-version: 3.9.0

    - name: Set up Toolchain
      shell: bash
      run: |
          echo COMPUTERNAME=`hostname` >> $GITHUB_ENV
          # Set up for unit testing against JPA repository
          echo SPRING_DATABASE=jpa >> $GITHUB_ENV
          mkdir -p ~/.m2 \
          && cat << EOF > ~/.m2/toolchains.xml
          <?xml version="1.0" encoding="UTF8"?>
          <toolchains>
            <toolchain>
              <type>jdk</type>
                <provides>
                  <version>21</version>
                  <vendor>sun</vendor>
                </provides>
                <configuration>
                  <jdkHome>$JAVA_HOME_21_X64</jdkHome>
                </configuration>
            </toolchain>
            <toolchain>
              <type>jdk</type>
                <provides>
                  <version>17</version>
                  <vendor>sun</vendor>
                </provides>
                <configuration>
                  <jdkHome>$JAVA_HOME_17_X64</jdkHome>
                </configuration>
            </toolchain>
          </toolchains>
          EOF

          cat << EOF > ~/.m2/settings.xml
          <?xml version="1.0" encoding="UTF8"?>
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
            xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
            xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0
            https://maven.apache.org/xsd/settings-1.0.0.xsd">
            <localRepository>~/.m2/repository</localRepository>
            <interactiveMode />
            <usePluginRegistry />
            <offline />
            <servers>
              <server>
                <id>github</id>
                <username>${{ github.actor }}</username>
                <password>${{ secrets.GITHUB_TOKEN }}</password>
              </server>
              <server>
                <id>github-bom</id>
                <username>${{ github.actor }}</username>
                <password>${{ secrets.GITHUB_TOKEN }}</password>
              </server>
              <server>
                <id>github-core</id>
                <username>${{ github.actor }}</username>
                <password>${{ secrets.GITHUB_TOKEN }}</password>
              </server>
              <server>
                <id>github-hub</id>
                <username>${{ github.actor }}</username>
                <password>${{ secrets.GITHUB_TOKEN }}</password>
              </server>
            </servers>
            <mirrors />
            <proxies />
            <profiles />
            <activeProfiles />
          </settings>
          EOF
          BASE_TAG=`mvn help:evaluate -Dexpression=project.version -q -DforceStdout`
          echo BASE_TAG=$BASE_TAG >> $GITHUB_ENV
          echo VERSION_ONLY_TAG=`echo -n $BASE_TAG | sed "s/-.*$//g"` >> $GITHUB_ENV

    # Development CI always builds a SNAPSHOT candidate. Release tags are the
    # business of release.yml and hotfix.yml.
    #
    # The old "List m2" debug step was removed: it interpolated
    # github.base_ref and github.head_ref straight into an inline script, which
    # actionlint flags as a script-injection site.
    - name: Set the development image tags
      shell: bash
      run: |
        {
          echo "IMAGE_TAG=${VERSION_ONLY_TAG}-SNAPSHOT-${GITHUB_RUN_NUMBER}"
          echo "IMAGE_BRANCH_TAG=${VERSION_ONLY_TAG}-SNAPSHOT"
        } >> "$GITHUB_ENV"

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v6
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{vars.AWS_REGION}}
        
    - name: Maven Install
      env:
        COMMON_PASS: ${{ secrets.COMMON_PASS }}
        ELASTIC_API_KEY: ${{ secrets.ELASTIC_API_KEY }}
        AMAZON_DYNAMODB_TABLE: izgateway-dev-test
        JWT_ISSUER: https://dev.console.izgateway.org
      run: |
        env && mvn -B -U clean package install site -Dbuildno=${{github.run_number}} \
            -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn \
            -DskipDependencyCheck=true \
            -Dimage.tag=${{env.IMAGE_TAG}}
            
# Use GitHub Action to speed up and improve dependency checking.
# Automatic dependency checking is disabled in the build; this replaces it.
#
# Three corrections. The NVD cache steps were removed: they cached
# ~/dependency-check-data on the runner, but inside the scan container ~ is
# /github/home, so the scanner never read them. --data was removed for the same
# reason: the container image ships with a populated NVD database at the default
# path, which is why the action injects --noupdate, and pointing --data at an
# empty directory made every scan fail with "Autoupdate is disabled and the
# database does not exist". continue-on-error hid that, so this scan has not
# worked for as long as --data has been present.
#
# OSS Index is disabled because the configured credentials are rejected by
# Sonatype, and the analyzer exception fails the scan on its own.
#
# continue-on-error is gone: a finding at or above CVSS 7 now fails development
# CI, matching the release gate.
    - name: Dependency Check
      env:
        # Per https://github.com/marketplace/actions/dependency-check, fix JAVA_HOME location for action
        JAVA_HOME: /opt/jdk
      uses: dependency-check/Dependency-Check_Action@main
      timeout-minutes: 15
      with:
        project: IZ Gateway Hub
        path: target/${{env.IMAGE_TAG}}.jar
        format: 'HTML'
        out: 'target/site'
        args: >
          --disableOssIndex
          --failOnCVSS 99
          --format JSON
          --suppression ./dependency-suppression.xml
          --nvdApiKey ${{ secrets.NVDAPIKEY }}
          --disableNuspec
          --disableNugetconf
          --disableAssembly
          --disableCentral

    - name: Upload dependency check log
      uses: actions/upload-artifact@v7
      if: ${{ always() }}
      with:
        name: DependencyCheck
        path: ./target/site/dependency-check-report.*

    - name: Publish Site (Develop)
      # Publish to /develop/ for: push to develop, PRs targeting develop, scheduled runs, manual dispatch
      if: |
        github.ref == 'refs/heads/develop' ||
        (github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'develop')
      uses: peaceiris/actions-gh-pages@v4.1.0
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./target/site
        destination_dir: develop

    # current/ and v{version}/ are published by the release workflow only.

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2
      
    - name: Login to GitHub Repository
      uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5
          
    - name: Build and push Docker Image
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        ECR_REPOSITORY: izgateway-dev-phiz-web-ws
      id: build-image
      run: |
        docker buildx build --build-arg JAR_FILENAME=${{env.IMAGE_TAG}}.jar --build-arg IZGW_VERSION=${{env.IMAGE_TAG}} \
            --progress=plain --load \
            --cache-from=type=gha,scope=izgwhub \
            --cache-to=type=gha,scope=izgwhub,mode=max \
            -t iz-gateway:${{env.IMAGE_TAG}} \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:${{env.IMAGE_TAG}} \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:${{env.IMAGE_BRANCH_TAG}} \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
            -t ghcr.io/izgateway/izgw-hub:${{env.IMAGE_TAG}} \
            -t ghcr.io/izgateway/izgw-hub:${{env.IMAGE_BRANCH_TAG}} \
            -t ghcr.io/izgateway/izgw-hub:latest .
        docker image push --all-tags ghcr.io/izgateway/izgw-hub
        docker image push --all-tags $ECR_REGISTRY/$ECR_REPOSITORY

        # The verify job checks that ECS is serving this exact image and
        # promotes it by digest, so a concurrent build that moves latest
        # cannot be verified or promoted in its place.
        CANDIDATE_DIGEST="$(aws ecr describe-images \
          --repository-name "$ECR_REPOSITORY" \
          --image-ids "imageTag=${IMAGE_TAG}" \
          --query 'imageDetails[0].imageDigest' --output text)"
        case "$CANDIDATE_DIGEST" in
          sha256:*) ;;
          *) echo "::error::Could not read the registry digest of ${IMAGE_TAG}. Got '${CANDIDATE_DIGEST}'."; exit 1 ;;
        esac
        echo "candidate_digest=${CANDIDATE_DIGEST}" >> "$GITHUB_OUTPUT"
        echo "Candidate image ${IMAGE_TAG} is ${CANDIDATE_DIGEST}."

    # Newman asserts the deployed build number and timestamp. The verify job
    # has no target/ directory, so they are captured here and passed across.
    # The old verify job read target\classes\build.txt, and bash turns \c and
    # \b into plain characters, so both values were empty and the collection's
    # `|| ".*"` made that assertion match anything.
    - name: Capture build metadata
      id: build-meta
      shell: bash
      run: |
        set -euo pipefail
        F=target/classes/build.txt
        [ -f "$F" ] || { echo "::error::$F is missing."; exit 1; }
        read_field() {
          sed -n "s/^[[:space:]]*$1:[[:space:]]*//p" "$F" | head -1 | tr -d '\r' | sed 's/[[:space:]]*$//'
        }
        B="$(read_field Build)"; T="$(read_field Timestamp)"
        [ -n "$B" ] || { echo "::error::Could not read Build from $F."; exit 1; }
        [ -n "$T" ] || { echo "::error::Could not read Timestamp from $F."; exit 1; }
        {
          echo "build_number=$B"
          echo "build_timestamp=$T"
        } >> "$GITHUB_OUTPUT"

    # AWS_REGIONS can be set in GitHub Settings -> Secrets and variables -> Actions -> Variables -> Repository Variables
    # Format: space-separated regions (e.g., "us-east-1 us-west-2")
    # Default of us-east-1 will be used if this is not set
    # ECS_DESIRED_COUNT can be set in GitHub Settings -> Secrets and variables -> Actions -> Variables -> Repository Variables
    # This is used to know how many container instances to start. Default is 1 if not set
    - name: Update ECS service to force new deployment of latest image
      id: ecs-deploy
      uses: ./.github/actions/ecs-deploy
      with:
        cluster: izgateway-dev-izgateway-services
        service: izgateway-devalb-service
        regions: ${{ vars.AWS_REGIONS }}
        desired_count: ${{ vars.ECS_DESIRED_COUNT }}

    - name: Upload build environment as artifact for failed build
      uses: actions/upload-artifact@v7
      if: ${{ failure() }}
      with:
        name: build-failure
        path: .

    - name: Upload dependency check log
      uses: actions/upload-artifact@v7
      if: ${{ always() }}
      with:
        name: DependencyCheck
        path: ./target/dependency-check-report.*

    - name: Output the image tag
      id: output_image_tag
      run: echo "image_tag=${{env.IMAGE_TAG}}" >> "$GITHUB_OUTPUT"

    - name: Output the version only image tag
      id: output_version_only_tag
      run: echo "version_only_tag=${{env.VERSION_ONLY_TAG}}" >> "$GITHUB_OUTPUT"

  verify:
    needs: build
    runs-on: ubuntu-latest
    steps:

    - uses: actions/checkout@v7

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v6
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{vars.AWS_REGION}}

    # The shared verifier, also used by release.yml and hotfix.yml, so that the
    # two paths cannot drift. It confirms the deployment is stable and still
    # primary, that the Hub container runs this exact image, that the logging
    # client connected, and that the Newman suite passes. It also owns the
    # temporary security-group rule and removes the credential files it makes.
    - name: Verify the deployed candidate
      uses: ./.github/actions/verify-hub
      with:
        cluster: izgateway-dev-izgateway-services
        service: izgateway-devalb-service
        regions: ${{ vars.AWS_REGIONS }}
        deployment_ids: ${{ needs.build.outputs.deployment_ids }}
        expected_image_digest: ${{ needs.build.outputs.candidate_digest }}
        expected_build: ${{ needs.build.outputs.build_number }}
        expected_timestamp: ${{ needs.build.outputs.build_timestamp }}
        security_group_id: ${{ vars.AWS_SECURITY_GROUP_ID }}
        testing_cert: ${{ secrets.TESTING_CERT }}
        testing_key: ${{ secrets.TESTING_KEY }}
        testing_pass: ${{ secrets.TESTING_PASS }}
        bearer_token_expired: ${{ secrets.BEARER_TOKEN_EXPIRED }}
        bearer_token_for_cicd: ${{ secrets.BEARER_TOKEN_FOR_CICD }}
        bearer_token_revoked: ${{ secrets.BEARER_TOKEN_REVOKED }}
        bearer_token_wrong_secret: ${{ secrets.BEARER_TOKEN_WRONG_SECRET }}
        bearer_token_wrong_env: ${{ secrets.BEARER_TOKEN_WRONG_ENV }}
        bearer_token_no_usetype: ${{ secrets.BEARER_TOKEN_NO_USETYPE }}

    - name: Login to Amazon ECR
      id: login-ecr2
      uses: aws-actions/amazon-ecr-login@v2

    # Promote by the recorded digest. The old step pulled :latest, so a build
    # from another run that had moved latest would have been tagged good.
    - name: Tag the verified image as good
      env:
        ECR_REGISTRY: 357442695278.dkr.ecr.${{vars.AWS_REGION}}.amazonaws.com
        ECR_REPOSITORY: izgateway-dev-phiz-web-ws
        CANDIDATE_DIGEST: ${{ needs.build.outputs.candidate_digest }}
      run: |
        set -euo pipefail
        SOURCE="${ECR_REGISTRY}/${ECR_REPOSITORY}@${CANDIDATE_DIGEST}"
        docker pull "$SOURCE"
        docker tag "$SOURCE" "${ECR_REGISTRY}/${ECR_REPOSITORY}:good"
        docker image push "${ECR_REGISTRY}/${ECR_REPOSITORY}:good"
        echo "good identifies the verified candidate ${CANDIDATE_DIGEST}."

    - name: Upload build environment as artifact for failed build
      uses: actions/upload-artifact@v7
      if: ${{ failure() }}
      with:
        name: verify-failure
        path: |
            .
            !testing/newman.key
            !testing/newman-cert-list.json
