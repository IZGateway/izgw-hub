name: 'ECS Deploy'
description: 'Force a new ECS deployment and return deployment IDs per region'

inputs:
  cluster:
    description: 'ECS cluster name'
    required: true
  service:
    description: 'ECS service name'
    required: true
  regions:
    description: 'Space-separated list of AWS regions'
    default: 'us-east-1'
  desired_count:
    description: 'Desired number of running tasks'
    default: '1'

outputs:
  deployment_ids:
    description: 'Space-separated region=deployment_id pairs'
    value: ${{ steps.deploy.outputs.deployment_ids }}

runs:
  using: 'composite'
  steps:
    - id: deploy
      shell: bash
      # Inputs arrive as environment values rather than being interpolated into
      # the script body.
      env:
        CLUSTER: ${{ inputs.cluster }}
        SERVICE: ${{ inputs.service }}
        REGIONS_INPUT: ${{ inputs.regions }}
        DESIRED_INPUT: ${{ inputs.desired_count }}
      run: |
        set -euo pipefail

        REGIONS="${REGIONS_INPUT:-us-east-1}"
        DESIRED="${DESIRED_INPUT:-1}"

        IDS=""
        for region in $REGIONS; do
          echo "[$region] Updating ${SERVICE} (desired: ${DESIRED})"
          DEPLOYMENT_ID="$(aws ecs update-service \
            --region "$region" \
            --cluster "$CLUSTER" \
            --service "$SERVICE" \
            --force-new-deployment \
            --enable-execute-command \
            --desired-count "$DESIRED" \
            | jq -r '.service.deployments[] | select(.status=="PRIMARY") | .id')"

          # An empty or unexpected id must not be recorded as a deployment.
          # A later waiter would otherwise look for tasks of "region=" and
          # report a confusing absence instead of this failure.
          case "$DEPLOYMENT_ID" in
            ecs-svc/*) ;;
            '')
              echo "::error::[$region] update-service returned no PRIMARY deployment id for ${SERVICE}."
              exit 1
              ;;
            *)
              echo "::error::[$region] unexpected deployment id '${DEPLOYMENT_ID}' for ${SERVICE}. Expected an ecs-svc/... id."
              exit 1
              ;;
          esac

          echo "[$region] Deployment ID: $DEPLOYMENT_ID"
          IDS="${IDS}${region}=${DEPLOYMENT_ID} "

          # Record the receipt after each region succeeds. Rewriting the output
          # every time keeps the partial set available when a later region
          # fails, so the caller can report what was already deployed.
          echo "deployment_ids=${IDS}" >> "$GITHUB_OUTPUT"
        done

        echo "Recorded deployments: ${IDS}"
